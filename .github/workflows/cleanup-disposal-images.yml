name: Cleanup old disposal images (manual fallback)

# Actual daily schedule is Vercel's own Cron Jobs feature - see
# vercel.json. This workflow is just a manual escape hatch in case
# Vercel Cron is ever paused/misconfigured; it is not scheduled itself.
on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup-disposal-images cron endpoint
        run: |
          curl --fail-with-body -sS -X DELETE \
            "https://cen-smart-bin.vercel.app/api/cron/cleanup-disposal-images" \
            -H "x-api-key: ${{ secrets.API_KEY }}"
